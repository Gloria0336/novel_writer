       父親（建議 Gideon／基甸，本章只被提及）、老金丹（建議 Ambrose／安布羅斯，稱呼建議「叔公」）、
       主事的長輩（建議 Hollis／霍利斯）。表哥 Merrick／梅里克已定。"
