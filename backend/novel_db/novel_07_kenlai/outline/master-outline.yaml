canon_outline:
  project_status: act1_in_progress_ch002_written_ch003_outlined
  current_chapter: Ch002
  current_endpoint: >
    Day 1 上午偏晚。艾茉森人在洛克西亞家族莊園主屋東側的陽光房裡，
    已坐進母親身旁的沙發，剛問出「母親，找我有什麼事？」。
    Ch003 從這句話的回答開始，中間不跳接。
  canon_scope:
    covered_chapters: [Ch001, Ch002]
    note: >
      僅記錄已寫成正文的 canon。目前為 Ch001、Ch002。
      Ch003 大綱已定稿於 outline/act1.2.md，正文尚未開始。
      設定 canon（v43，438 項已確認決策）位於 bible/ 與 context/secrets-lockbox.md。
      **正文優先於設定**：chapters/ 與 bible/ 或 outline/ 衝突時，以正文為準並回頭修正後者。
  source_of_truth:
    prose_canon: chapters/          # 最高權威
    world_rules: bible/worldbuilding.md
    places: bible/location.yaml
    people: bible/characters.yaml
    history: bible/timeline.yaml
    threads: bible/plot-threads.yaml
    hidden: context/secrets-lockbox.md
    style_guide: context/CONTEXT.md（敘事文體規範，由 Ch001 定調）
    chapter_outlines: outline/act1.1.md（Ch002）、outline/act1.2.md（Ch003）
    raw_reference: temp/v43.md
  chapter_beats:
    - chapter: Ch001
      status: written
      title_in_file: 第一章
      day: Day 1
      time_span: 清晨鐘響 → 上午日出後
      pov: 艾茉森・席恩・洛克西亞（第三人稱過去式；開場為不屬於任何人的環境鏡頭）
      locations: [western-wasteland, loxia-ranch, loxia-family-quarter, morning-rock, loxia-town, loxia-town-street]
      function: >
        災前日常的基準線。在核心衝突介入之前，先建立「一天如何運作」「他是什麼樣的人」
        「他與這座小鎮的關係」三件事。全章不推進任何劇情衝突。
      beats:
        - 牧場晨間作業啟動（鏡頭先於主角登場）→ 鐘聲報時 → 起床、更衣
        - 山坡巨岩上的早課；靈氣極短停滯，立即散氣不強衝；「又快了一點」
        - 下山途中見獸群外一頭躁動的年輕公牛，認出並判定無礙
        - 進鎮，與孩子群、乳製品店、早餐店三段抬槓；靠窗吃早餐
        - 回馬廄照料史黛西，發現前蹄輕微腫脹，下「今天少跑一點」的處置；上馬出發
      opened_threads: [stacy-foreleg, restless-young-bull, faster-than-expected]
      lockbox_leaks: 無。全章落在 [常識] 層，未觸及 secrets-lockbox 任何一層。
      deviations_from_plan:
        - 時態由規劃的「現在式」改為實際的「過去式」——以正文為準，已更新 outline/act1.md。
        - 結構由規劃的三段改為實際的四段。
        - 未執行：以旁人態度側寫「最有天賦但非法定繼承人」的位置（移交後續章節，改從族人一側著手）。
        - 未執行：行政孤立感的畫面（空蕩公車站／一天一班車的告示）。

    - chapter: Ch002
      status: written
      day: Day 1
      time_span: 上午（承 Ch001 章尾）→ 上午偏晚
      pov: 艾茉森・席恩・洛克西亞（第三人稱過去式）
      outline_file: outline/act1.1.md
      locations: [western-wasteland, loxia-ranch, loxia-town, loxia-manor]
      function: >
        以突發事件側面描寫主角的能力；詳細呈現他的中性氣質；
        章末第一次把鏡頭帶進洛克西亞家族的莊園內部。仍不推進主線。
      beats:
        - 巡邏塔例行公事：爬上瞭望層、視野確認、翻閱紀錄本、與巡邏員文森簡短交接、檢查訊號器與探照燈
        - 進草場前先聽見騷動；三名牧場工人以三方拉繩制不住早上那頭公牛
        - 他讓史黛西跑到安全距離即停，自己下馬跑完最後一段（Ch001「今天少跑一點」的限制在此被測試）
        - 命三人鬆繩、斜向繞至牛的側前方，以靈力安撫；繩結自行鬆開，牛主動以額頭觸碰他的掌心
        - 腰間靈球亮起、浮出短訊；他丟下一句「交給你們了」便離開
        - 三名工人留在原地：年輕外來雇工把他認成女孩，老牧者以「他叫 Em」解圍，年輕人被同伴取笑到耳根發紅
        - 他騎馬繞行至洛克西亞家族莊園，走小鐵門進入，穿過主屋大廳、內院噴泉，抵達東側陽光房
        - 見到母親，坐進她身旁的沙發，問「母親，找我有什麼事？」
      opened_threads: [stacy-foreleg, restless-young-bull]
      lockbox_leaks: 無。全章落在 [常識] 層，未觸及 secrets-lockbox 任何一層。
      deviations_from_plan:
        - 巡邏員被具名為「文森」（大綱原未指定具名程度）。
        - 未執行第四段「家族內部回報」：正文改為被靈球召回莊園、停在陽光房見母親。
        - 連帶未執行：位階側寫、稱呼節拍④（Cyn）、第一批具名族人 → 全部移交 Ch003。
        - 新增 canon：靈球（腰側通訊靈器）、洛克西亞家族莊園的空間細節。
        - 待裁決：正文寫出可見的靈光與繩索嗡鳴，與 worldbuilding「練氣不發光、不生異象」有張力；
          依權威順序以正文為準，建議註記為家傳道統施術時的表現，而非練氣本身的表現。

    - chapter: Ch003
      status: outlined
      day: Day 1
      time_span: 上午偏晚（承 Ch002 章尾，中間不跳接）
      pov: 艾茉森・席恩・洛克西亞（第三人稱過去式）
      outline_file: outline/act1.2.md
      locations: [loxia-manor]
      function: >
        以母子互動帶出家族與鄉村的文化意象；把家族寫成一群正在上班的人；
        立起「家族眼中耀眼的明日之星」並讓讀者看出他有點驕縱；
        由家族事務帶出老金丹，讓他說出部分家族秘密。補上 Ch001、Ch002 都欠著的位階側寫。
      beats:
        - 第一段｜陽光房：母親。文化意象靠手邊實物帶；稱呼節拍④「Cyn」落地；正事（叔公要看他）最後才順口提起
        - 第二段｜穿過莊園：家族生活橫切面；明日之星的環境層；驕縱證據①（別人替他做的事他理所當然地接受）
        - 第三段｜老金丹的傳功評定：家族秘密五件事、位階側寫、驕縱證據②③。本章重心
        - 第四段｜表哥梅里克：稱呼節拍⑤「Emmy」、調侃節拍（會有男生愛上你）、驕縱被看見但不被戳破
      lockbox_leaks: 規劃為零。老金丹不得說天奧玄體、體質來歷與失傳功法內容（他本人亦不知情）。
  character_state_snapshot:
    protagonist: >
      艾茉森・席恩・洛克西亞，15 歲，西部荒原洛克西亞鎮，家族旁系。修仙練氣一系。
      此刻只有理性我在場（感性我沉睡、折衷我尚未存在、觀察者永不上台）。
      狀態安穩無傷。[Ch002] 已完成巡邏塔交接、在草場制服一頭失控的公牛，
      經靈球傳訊召回，人在家族莊園東側陽光房、母親身旁。
      唯一的個人資訊：他知道自己修煉速度快於預計，並自我警惕不能急。他沒有告訴任何人。
    stacy: >
