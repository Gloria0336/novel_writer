speculative_long_arc:
  editable: true
  status: author_adjustable_projection
  note: >
    這一區是根據 v43 世界觀做的長線推演，非既定 canon，可自由修改或整段丟棄。
    v43 本身將這類內容列為「敘事線索，尚待確認」。
  central_questions:
    - 主角要解決的是個人的位置問題，還是世界的存續問題？兩者在哪一章接上？
    - 「修復道門」的競爭要不要在故事中被主角捲入？
    - 混沌要作為背景壓力，還是要走到「有意志」那一步？
  structural_assets:
    # 世界本身已備好的三段式壓力，可直接當作長線骨架
    - level: 個人
      material:
        - 這個世界的頂層由長壽者、血脈與碑上的排序把持，唯一沒被納入計算的是無人留意的人。
        - 藏拙是核心生存技能；出身決定敘事形態（聯邦＝憑實績攀爬／門派＝恩庇網絡鑽營）。
        - 失去正道身分不是絕對死路：黑市、散修、移民聯邦都是活路，代價各不相同。
    - level: 制度
      material:
        - 制度開著門、現實走不進去：碑的門是能力問題，登記的門是恐懼問題。
        - 附屬城市層是少數不由五方直接治理、又不算無主地的空間——故事可以在這裡長時間發生而不驚動任何一方。
        - 「第一個上碑的非門派組織」是從未發生卻完全合法的歷史性事件。
    - level: 世界
      material:
        - 徵候是公開的，只是沒有人知道那是徵候。
        - 山巔人以為在爭席位，實際上在爭補給線（此層屬 secrets-lockbox，不得提前說破）。
        - 混沌從異象走向實體、神智、意志，是一條與世界衰退同步的成長曲線。
  projected_arc:
    - phase: 第一階段 / 開局
      function: 建立主角、其社會位置與這個世界的規則感。
      progress: >
        Ch001 已完成其中的「建立主角與其日常世界」。舞台定在洛克西亞鎮之後，
        「這個世界的規則感」在第一幕已不可能由勢力層級的規則來建立——見下方修正。
      likely_material:
        - >
          修正：「兩體系無法換算」「玉璞是界線」「庇護＝登記」三條硬規則，
          在洛克西亞鎮這個沒有行政設施的邊陲產業聚落無從演示，
          已移交給主角離開家鄉之後的段落。第一幕改為建立地方性的規則感
          （鐘聲、牧場、熟人網絡、修煉是私事而非身分）。詳見 outline/act1.md。
        - 第一個需要付出代價的選擇，最好落在身分與庇護上（登記、附屬、被逐出）——
          但依現行結構，這一刻更可能落在獸災之夜之後，而非第一幕之內。
    - phase: 第二階段 / 擴張
      function: 把主角推出原本的知情層級。
      likely_material:
        - 接觸到一件「只有儀器讀得到、法術看不見」的事。
        - 遇上第一樁無法用既有規則解釋的異常事件。
    - phase: 第三階段 / 翻面
      function: 讓主角理解他一直在爭的東西被誤解了。
      likely_material:
        - 碎片、行會的長期資料，或「世界之外那條路」三者擇一作為真相的合法來源。
        - 揭露順序建議：第三層（道門可修復）→ 第二層（大帝會消散）→ 第一層（大帝是燃料）。
