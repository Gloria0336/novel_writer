       大綱建議不放，留到災前的最後一章。"
    - "[Ch003 已定] 老金丹在 Ch003 登場。act1.1.md 的「老金丹本章不出現」只適用於 Ch002，此限制已解除。"
    - "[Ch003 已定] 家族事務的載體為「傳功評定」而非靈駒競速賽（理由見 act1.2.md）。
       競速賽降級為背景話題，保留為 Ch004 出小鎮的出口。"
