    - 撰寫 Ch003 正文：陽光房的母親 → 穿過莊園 → 老金丹的傳功評定 → 表哥梅里克。
    - "**補完 Ch002 的 canon 回填**（.cursorrules 要求）：last-chapter-summary、characters（文森與家族成員）、
      location（莊園空間）、worldbuilding（靈球）、timeline（Ch002 四條）、secrets-lockbox（逐章揭露紀錄）。"
    - 裁決 Ch002 的可見靈光與 worldbuilding「練氣不發光、不生異象」之間的張力。
    - 決定核心衝突與故事承諾（讀者被許諾的主要張力是什麼）。
    - 決定第一幕結尾（主角付出第一個不可逆代價的那一刻）。
    - 決定第一幕篇幅，以及讀者是否預知災難將至（plot-threads protagonist-18）。
    - 決定 Ch001 的鎮民群像是否要固定為具名角色。
    - 決定獸災之夜與 Day 1 的間隔（兩者皆在主角 15 歲期間，故不超過一年）。
  continuity_flags:
