# 來源：temp/v43.md（v43，勢力關係）＋ temp/角色設定_艾茉森洛克西亞_v1.md（v1，主角人物關係）
#       ＋ chapters/Ch001.md（正文，最高權威）。
# 標記 [Ch001] 者為正文已寫定的關係表現，後續章節須沿用。
# 具名配角與敵對者確立後，再於 relationships 下繼續補人物對。

status:
  note: >
    主角人物關係已建；Ch001 已讓「主角—史黛西」與「主角—鎮民群像」兩段關係在正文中成立。
    具名配角與敵對者尚未確立。以下另有勢力關係，寫作時視為既定局勢背景——
    Ch001 完全未觸及勢力層級，第一幕的舞台是地方性的，不需要局勢知識即可閱讀。

faction_diplomacy:
  - subject: 波希特米亞聯邦
    ordering_close_to_distant: [偉恩企業, 正道聯盟, 亞特蘭蒂斯帝國, 荒阪集團]
    note: 正道與亞特蘭蒂斯並列同級。
  - subject: 亞特蘭蒂斯帝國
    ordering_close_to_distant: [偉恩企業, 其餘四方並列]
    note: 國風排外，半鎖國。

faction_relationships:
  - pair: [偉恩企業, 波希特米亞聯邦]
    dynamic: >
      軍事工業複合體。國家與企業各持部分反修士科技的機密，任一方皆無法單獨完整部署。
      表面合作，檯面下時有摩擦。偉恩名義上受聯邦法律管轄，但聯邦實務上不敢執法。
    trust_level: 中（結構性互賴，非信任）
    tension: 中高
    conflict_points:
      - 唯一講法律的地方，法律對唯一該管的對象無效
      - 偉恩正祕密進行增強修士研究，聯邦未必知情
      - 摩擦從一開始就存在：偉恩當年因理念不合退出同盟會
    continuity_notes:
      - 偉恩的根就在聯邦境內，人質關係是雙向的：偉恩抽手則聯邦崩解，但偉恩也無處可去。

  - pair: [偉恩企業, 大地綜合行會／同盟會]
    dynamic: >
      偉恩曾是三千年前秘密保護行會的成員之一，卻拒絕加入由行會分化出去的同盟會——
      同盟會主張「資質不應成為決定世界的方式」，而偉恩以血脈立身。
    trust_level: 低
    tension: 低（無正面衝突，理念根本相斥）
    conflict_points:
      - 偉恩守的是本體，不是分身

  - pair: [正道聯盟, 大地綜合行會]
    dynamic: >
      三千年前正道門殘餘體系對行會的清算最徹底，使大道洲至今無科研傳承；
      而今日大道洲量東西、驗貨、算數時使用的，正是當年被自己打進地下的那群人留下的標準。
    trust_level: 不適用
    tension: 低（已被遺忘）
    conflict_points:
      - 沒有人記得那是誰的東西了

  - pair: [正道聯盟, 亞特蘭蒂斯帝國]
    dynamic: >
      三千年前帝國趁正道門覆滅入侵，被殘餘門派聯手擊退——那是三千年來唯一一次全員一致，
      正道聯盟即在那場戰爭中被逼出來。帝國官方否認或改寫該段歷史。
    trust_level: 低
    tension: 中（歷史包袱，非現行衝突）
    conflict_points:
      - 雙方對同一段歷史各有處置：帝國改寫，聯盟裝傻

  - pair: [荒阪集團, 全體]
    dynamic: >
      滲透型、無實質核心（複數等價節點）。主導黑市與地下經濟，掌握情報，
      並在灰色與禁忌領域做研發。反修士技術的境外流出主要透過黑市與荒阪。
    trust_level: 無
    tension: 高（持續但低強度）
    conflict_points:
      - 國力墊底卻不可能被消滅：打不掉一個不在任何地方的東西
      - 持有天絕靈魂碎片之一，並以之為儀器撬動道與境界

  - pair: [門派, 附屬城市]
    dynamic: >
      門派提供保護、武力支援、靈氣資源與功法；附屬城提供人才、勞力與民生物資。
      附屬城為自治，一城可同時附屬多個門派（少見且易生衝突）。
    trust_level: 依個案而異
    tension: 依個案而異
    conflict_points:
      - 直屬是身分，附屬是合約——合約會到期、會轉向、會被搶
      - 附屬城自行登記加入聯盟「從未明文禁止，但默認不行」，阻力來自城市自身的恐懼
      - 多重附屬引發的衝突各憑實力解決，聯盟不介入
    continuity_notes:
      - 靈脈本身並非附屬城拿出的對價。
      - 樓蘭城毀城事件即「單方面終止合約」的極端案例。

  - pair: [聯盟高層（上碑者）, 各行政區高層]
    dynamic: >
      聯盟高層對各所轄行政區高層存在有形無形的長期壓迫。「不希望城市獨立」是長久共識。
    trust_level: 低
    tension: 高（結構性、日常性）
    conflict_points:
      - 壓迫路徑與權力結構極為複雜，沒有單一模板
      - 自治是有邊界的自治：城市管自己的內政，頭上仍有一層聯盟的行政歸屬

  - pair: [北方門派, 南方門派]
    dynamic: >
      16 席南北大致均衡（北 7、南 9），北方平均排名更靠前（前六名佔五席）。
      在一致決之下，北方掌握位階，南方掌握票。
    trust_level: 中
    tension: 中
    conflict_points:
      - 南方擋得住，卻推不動
      - 資源上南方高度依賴北方的靈氣輸入；北方對南方物資僅部分依賴
    continuity_notes:
      - 南北是一條橫切各派系的線，並非獨立派系。

  - pair: [原生派（七星）, 其他派系]
    dynamic: >
      原生派 7 席，最大派系但未過半，繼承正道門核心道統，名字裡沒有道統只有位階。
      煉器、卜算及其他旁門左道受冷落排擠，需依附其他派系；以錢入道倍遭歧視但經濟實力強大。
    trust_level: 低
    tension: 中
    conflict_points:
      - 天錦門有錢、有獨門技術、有否決權，卻仍要看人臉色——錢與技術不在位階清單上
      - 做東西的和買東西的一樣沒地位

relationships:
  # 來源：temp/角色設定_艾茉森洛克西亞_v1.md。配角與敵對者確立後繼續補入。
  - pair: [protagonist, 洛克西亞父母]
    dynamic: >
      父母於獸災之夜死於洛克西亞鎮內（家族內部）。主角受傷昏迷、醒來後小鎮已毀，
      因害怕面對而逃走——父母之死是他自我放逐最直接的重量之一。
    trust_level: 不適用（已逝）
    tension: 不適用
    conflict_points:
      - 主角背負自責，但父母本人並未有機會責怪他，是他自己責怪自己
    last_updated_in: planned

  - pair: [protagonist, 老金丹]
    dynamic: >
      家族當代最高境界者，悲劇當夜死於獸災。與主角一樣不知道天奧玄體與家族失傳功法的關係，
      同樣只知道「（主角的體質）有特殊」，不知特殊在何處。
    trust_level: 不適用（已逝）
    tension: 不適用
    conflict_points: []
    last_updated_in: planned

  - pair: [protagonist, 洛克西亞倖存族人]
    dynamic: >
      倖存者不知悲劇當晚的真相細節（不知主角的誤判與逃走），沒有人責怪他，是他自己責怪自己。
      多年後相遇時，倖存者仍有可能認他為家族的傳承。
    trust_level: 倖存者對主角＝高（建立在不知情之上的信任）；主角對倖存者＝愧疚，難以坦然接受
    tension: 主角單方面的內在張力，外部無公開衝突
    conflict_points:
      - 倖存者的信任建立在不知情之上，一旦真相揭露將直接動搖
    last_updated_in: planned

  - pair: [protagonist, 靈駒史黛西]
    dynamic: >
      主角家鄉所贈的專屬靈駒，是唯一從獸災之夜活到現在、且靠氣息認人而不會因主角性別流動
      而誤讀他的存在。牧者契典僅存「支配」半，故兩者關係只能是支配、無法締約——
      史黛西是主角唯一的同伴，卻不是他能平等締結關係的對象。
      [Ch001] 正文首次呈現這段關係，形態為「支配之下的親暱」：史黛西躁動時，主角徑直走進欄位、
      不因牠壓耳粗鼻息而停步，以一句短促的「別動」讓牠僵住；隨後動手摸查頸側、肩部、前腿，
      發現腫脹後蹲身撥泥檢視。史黛西用鼻子重重頂他肩膀（抗議），他抵住牠的頭回「現在知道痛了？」，
      牠再頂一次，這次輕了一點。最後他嘆氣讓步：「今天少跑一點。」出發時牠急著往前，
      被拉住韁繩後不情願地放慢，他笑著說「我也不想留在這裡」，才鬆手放行。
    trust_level: 高（單向，基於氣息認同而非契約）
    tension: 低
    conflict_points:
      - 牧者契典「契約」半已失傳，兩者的關係形式本身即家族傳承殘缺的縮影
      - >
        [Ch001] 正文已示範這段關係的張力形狀：兩邊都在讓步，但只有一方能下命令。
        史黛西的抗議永遠只能是身體動作，主角的決定永遠是最終決定——
        「支配」的殘缺不需要說明，寫成一次讓步就夠了。
    open_state:
      - '[Ch001 章尾] 史黛西前蹄旁輕微腫脹、無傷口；主角的處置為「今天少跑一點」。此限制尚未被測試，須跨章追蹤。'
    last_updated_in: Ch001

  - pair: [protagonist, 洛克西亞鎮民（無名群像）]
    dynamic: >
      [Ch001] 熟稔、平常、彼此不客氣。鎮民會跟他抬槓、笑罵他「你小子現在連我都開始糊弄了」，
      也會關心他；孩子喊他「艾茉森哥」、拿他每天修煉的事來問。沒有人因為他的天賦或家族身分
      而對他特別恭敬或疏遠——他在這裡就只是一個每天都會經過的少年。
    trust_level: 高（雙向，且是不需要理由的那種）
    tension: 無
    conflict_points:
      - >
        [Ch001] 目前完全沒有衝突，這是刻意的。原規劃「以旁人態度側寫他最有天賦但非法定繼承人的位置」
        本章未執行，鎮民態度中看不出任何位階差異；若後續要補上，須從族人而非鎮民一側著手。
    continuity_notes:
      - >
        這段關係是本作最重要的沉沒成本：讀者對這批無名者愈熟悉，獸災之夜的重量愈大。
        後續災前章節建議重複使用同一批人，逐步累積辨識度。
    last_updated_in: Ch001
