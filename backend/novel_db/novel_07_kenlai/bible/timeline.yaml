# 來源：temp/v43.md（v43，世界背景）＋ temp/角色設定_艾茉森洛克西亞_v1.md（v1，主角悲劇）
#       ＋ chapters/Ch001.md（正文，最高權威）。
# 年代一律以「距今（故事現在）」表示；world_history 為固定背景年表。
# story_timeline 自 Ch001 起逐章記錄，Day 1 即正文起點（獸災之夜之前，主角 15 歲）。

world_history:
  - when: 百萬年前起
    event: 可被證實的真實歷史起點。有清楚文字記錄的歷史達數十萬年。
    note: 因歷史久遠，世上留有無數傳承、秘境、遺跡。

  - when: 數萬年前
    event: 波賽頓大帝證道，掌「海之道」，創立亞特蘭蒂斯帝國並據超級上古秘境建立宗教。
    note: 秘境早於波賽頓即已存在，並非其遺產，真正來歷至今不明。皇室為其直系血脈。

  - when: 最近一萬年
    event: 文明長期停滯於近似文藝復興前的低文明度。
    note: 成因為「四道鎖」——不可重複、不可量測、不公開、不缺乏。

  - when: 約 8000 年前
    event: >
      西部荒原（洛克西亞家族所在地）天地變化、地脈枯竭，昔日富饒平原化為荒原；
      此後八千年間該地區人口逐步遷離，僅洛克西亞家族仍留在此處，從事畜牧業，資質持續下滑。
    note: 家族曾在地脈鼎盛時期孕育出飛昇境；至獸災之夜前，家族最高境界僅剩一名垂垂老矣的老金丹。

  - when: 約 4300 年前
    event: 天絕證道，斥力自此出現；丈天尺校準危機爆發，測量學革命起點。
    note: 校準危機讀到的，是一個人成道的瞬間在整個世界留下的痕跡。

  - when: 4300–3000 年前（1300 年）
    event: 測量學發展期，即天絕擔任大帝的全部時間。秘密贊助、行會網絡擴散、理論躍遷完成。
    note: 保護期就是他成為大帝的全部時間。偉恩家族亦為保護者之一。

  - when: 3000 年前
    event: >
      正道門設計困住天絕並屠滅其滿門；天絕復仇，大戰打成大道洲兩半、生出絕天海。
      天絕以靈魂形體殺盡正道門五名大帝境，自身靈魂撕裂為五片碎片。道門於戰中被毀。
    note: 六位大帝俱亡。天絕是距今為止最後一名大帝。正道門就此分解。

  - when: 3000 年前（大戰後不久）
    event: 亞特蘭蒂斯帝國趁虛而入，殘餘門派被迫團結擊退——三千年來唯一一次全員一致。
    note: 正道聯盟即在戰場上被逼出來的臨時同盟。

  - when: 3000 年前起
    event: 所有行會遭全面政治性打壓，轉入地下；擴散停止，進入保管而非發展的狀態。
    note: 清算理由是「行會是天絕親民路線的政治符號」，宗門不知天絕與行會的關係。

  - when: 大戰之後（年代未細定）
    event: 正道門遺族內鬥。七星宗門的開陽宗滅亡，瑤光宗跌出碑外、隱世不出。
    note: 同盟穩住之後，第一件事是自己人先分了輸贏。瑤光仍持有原生分支的機密檔案。

  - when: 約 3000–2500 年前（約五百年）
    event: 行會的保管期。測量學不再是成長中的學科，而是一份被保管的遺產。

  - when: 約 2800 年前
    event: >
      十二位志同道合者組成「波希特米亞同盟會」（動機為跨地區的科研整合），
      經多年和平運動後轉為介入各國、引發革命，波希特米亞聯邦建立。
    note: 領導者恩菲・華盛頓為凡人，後為聯邦國父。首都華盛頓市得名於他。

  - when: 約 2500 年前起
    event: 測量學開始復興；行會歷經轉型，後得到波希特米亞聯邦扶持。
    note: 復興比聯邦建國晚了三百年——先有國，再有餘力去扶那群人。

  - when: 一千年以上之前
    event: 樓蘭城嘗試自行登記加入正道聯盟，登記失敗，遭原上級門派報復毀城。
    note: 記錄未被抹除，而是被刻意忽略淡忘，現存於門派典籍與聯盟檔案。

  - when: 約兩百多年前
    event: 裴思涵以生死戰鬥成道，成為現世唯一的武神。
    note: 成道前世稱「神龍大俠」。未親歷三千年前的大戰。

  - when: 距今年數未定（主角當前年齡與境界待定，見 bible/plot-threads.yaml protagonist-03）
    event: >
      獸災之夜——主角艾茉森・席恩・洛克西亞於洛克西亞鎮外巡邏塔上發現獸群異狀並誤判，
      整個巡邏隊遭到攻擊、來不及警告，主角受傷昏迷；醒來後發覺小鎮已被摧毀，因害怕面對而逃走，
      其後將逃走重新命名為放逐。其父母、老金丹及巡邏塔上全數同行者皆死於此夜。聯邦調查後登記為天災。
    note: >
      主角當時 15 歲、龍門境。「真正的罪是逃走而非誤判」的判斷見 context/secrets-lockbox.md 第五層，
      不可由旁白提前說破。
      [Ch001] 正文起點（story_timeline 的 Day 1）在此夜之前，主角同樣是 15 歲——
      故獸災之夜與 Day 1 相距不超過一年，但確切間隔尚未寫定，第一幕篇幅亦未定
      （見 plot-threads protagonist-18）。Ch001 全章未提及獸潮、未出現任何預警或不祥暗示。

  - when: 現代（故事現在）
    event: >
      五方鼎立、行會成為全球標準機構。斥力仍在但漸弱；秘境與禁地擴張、靈氣紊亂增加，
      零星異常事件已出現，尚無人將其連起來。
    note: 相關真相見 context/secrets-lockbox.md。

recurring_cadence:
  - item: 海捕令
    cadence: 歷史上約數十年發布一次。
  - item: 武神現身
    cadence: 數十年一次，市井現身、與常人無異、不表明身分。
  - item: 全員一致（國力 3.0）
    cadence: 三千年來僅發生過一次。
  - item: 西部荒原獸潮
    cadence: 跟隨當地獸群遷徙習慣，約兩年一次，屬可預期的週期性事件；主角的悲劇即為一次獸潮的極端個例。

story_timeline:
  # 說明：故事現在的時間軸。第一幕發生於獸災之夜「之前」，主角 15 歲。
  # Ch001 未指明日期、季節與星期，僅確立「這是平凡的一天」；曆法仍未設定，故不標年月日。
  - day: Day 1
    time_of_day: 清晨（鐘響前後，霧未散）
    chapter: Ch001
    location_id: [western-wasteland, loxia-ranch, loxia-family-quarter]
    event: >
      牧場晨間作業啟動：柵欄敞開，牧者以氣息驅群，大地氂牛走上苔原吃靈草；靈駒棚舍備料。
      鎮上鐘聲三響報時，艾茉森於第一聲醒、第二聲起身，盥洗更衣後離家。
    state_change: 無。日常的起點。

  - day: Day 1
    time_of_day: 清晨至日出（霧漸散）
    chapter: Ch001
    location_id: morning-rock
    event: >
      艾茉森在山坡中段的巨岩上做早課。靈氣自丹田循經脈行周天數周後，於某處出現極短停滯；
      他立即停手、散開靈氣，未強衝亦未續行，並確認體內無異常。下山前望見獸群外一頭
      剛成年、近日脾氣不佳的公牛，認出牠、判定無大礙。
    state_change: >
      主角意識到自己的修煉速度快於原本預計（「又快了一點」），並自我警惕「越是如此，越不能急」。
      此觀察目前無任何外部意義，僅為人物性格的展現。

  - day: Day 1
    time_of_day: 早晨（日光已穿過街道）
    chapter: Ch001
    location_id: [loxia-town, loxia-town-street]
    event: >
      艾茉森步行進鎮吃早餐。途中與趕著上學的孩子群、乳製品店店家、早餐店櫃檯各有一段簡短對話。
      在靠窗位置吃完早餐，看著小鎮從睡夢中醒來。
    state_change: >
      無事件性變化。功能是確立主角與鎮民的熟稔關係，以及全鎮對他「每天都在修煉」的共同認知。

  - day: Day 1
    time_of_day: 上午（晨霧徹底散去，日出越過地平線）
    chapter: Ch001
    location_id: [loxia-family-quarter, western-wasteland]
    event: >
      艾茉森返回家族馬廄照料靈駒史黛西，發現其前蹄旁有輕微腫脹、無傷口（昨日撞到），
      決定「今天少跑一點」。整備裝具後牽出馬廄、翻身上馬，離開洛克西亞鎮前往草場。
    state_change: >
      **史黛西前蹄輕微腫脹，主角已下「今天少跑一點」的處置——此傷勢與此限制須跨章追蹤，尚未被測試。**
      章尾落點：一人一馬在鎮與草場之間的路上移動中。

  - day: Day 1
    time_of_day: 上午（晴，霧已完全散盡，視野良好）
    chapter: Ch002
    location_id: [western-wasteland, loxia-patrol-tower]
    event: >
      艾茉森先往北繞至巡邏塔，將史黛西繫於塔下木樁，獨自登上瞭望層。
      與巡邏員文森完成例行交接：查閱紀錄本（天氣、能見度、獸群狀態、異常狀態、檢查點），
      補記今日狀況（天氣晴、視野良好、牛群位置正常、無異常），並逐一確認望遠鏡、探照燈、訊號器皆正常。
      文森提及昨日有幾頭牛跑遠、今晨已自行返回。
    state_change: >
      巡邏塔由 Ch001 的霧中剪影變為實體場景，其例行程序與器具已寫定。
      [Ch002] 主角在巡邏隊中的職稱含「小隊長」（文森稱其「艾茉森小隊長」）。
      全程為瑣碎的工作程序，未被賦予任何意義，亦無任何災難預告。

  - day: Day 1
    time_of_day: 上午
    chapter: Ch002
    location_id: [loxia-ranch, western-wasteland]
    event: >
      抵達草場前先聽見騷動。三名牧場工人以三方拉繩制不住早上那頭公牛。
      艾茉森讓史黛西跑至不驚動牛群的距離即停，下馬跑完最後一段；
      斜繞至牛的側前方，命三人放鬆繩索（判斷為「牠是在找能退的地方」），
      以靈力安撫其四蹄與肩背，一句「安靜」使其停止刨地，並教工人「別看牠的角，看牠的肩」。
      隨後以兩指引動，繩索表面浮起淡淡靈光、發出細微嗡鳴、繩結自行鬆開滑回三人手中。
      牛恢復自由後未逃走，主動以額頭觸碰他的掌心。
    state_change: >
      **[Ch001] 史黛西「今天少跑一點」的限制在此被測試一次**——他讓馬跑到安全距離即停、自己跑完最後一段，
      正文不解釋原因。**公牛失控的原因刻意留白，全章無人追究**，不可回溯寫成主角誤判的範例。
      公牛確定不命名，以「早上那頭」指稱，此決定須貫徹。

  - day: Day 1
    time_of_day: 上午
    chapter: Ch002
    location_id: loxia-ranch
    event: >
      腰間靈球震動並亮起兩下，表面浮出一行短訊。艾茉森看完後留下一句「交給你們了」便離開。
      留在原地的三名工人中，年輕的外來雇工因逆光與散開的金髮而將主角錯認為年輕女孩，
      老牧者以「他叫 Em」替他解圍；年輕人隨後被同伴取笑到耳根發紅。
    state_change: >
      **靈球為本章新增 canon**：佩掛腰側的通訊靈器，會震動、亮燈，表面可浮出短訊。
      傳訊者與訊息內容正文均未寫出。
      稱呼節拍落地三個：文森「艾茉森／艾茉森小隊長」、外來雇工「叫不出來」、老牧者「Em」。
      主角全程不在意，甚至沒注意到——他當時在檢查牛。

  - day: Day 1
    time_of_day: 上午偏晚
    chapter: Ch002
    location_id: loxia-manor
    event: >
      艾茉森沿草場外圍騎向鎮北緩坡上的洛克西亞家族莊園，不走正門，由外圍一扇無守衛的小鐵門進入，
      經石板路與碎石路騎至主屋前，將史黛西交給僕人看顧。
      進屋後穿過挑高大廳（深色木地板、兩側家族歷代畫像）、長廊與內院噴泉，
      走向主屋東側的陽光房。看見裡面的人影時腳步停頓，肩膀放鬆，腳步轉為輕快。
      推門進入後直接在母親身邊坐下，身體陷進靠墊。
    state_change: >
      **洛克西亞家族莊園首次寫入正文**，空間細節已定（見 bible/location.yaml）。
      **主角的母親首次登場但未具名、未描寫外貌**，僅寫出他在她面前卸下防備。
      章尾落點：他偏過頭問「母親，找我有什麼事？」——Ch003 從這句話的回答開始，中間不跳接。

