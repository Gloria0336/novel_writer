continuity_notes:
  - 年代一律以「距今」表述，避免使用曆法（世界曆法尚未設定）。
  - 三千年前的大戰是全世界的時間原點，多數制度（聯盟、絕天海、行會地下化）都由此起算。
  - 修士與凡人的時間感不同：上層長期不更替，權力高度固化，閉關可長達數十至數百年。
  - 閉關者可被喚醒，但代價極高（損耗壽元），且依個人而異。
