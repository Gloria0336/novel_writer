# 主角、配角待作者決定後填入 protagonist 區塊。

status:
  note: 世界觀已完成，主角與敘事角色尚未建立。
  pending_decisions:
    - 主角是誰、出身何方勢力（出身決定敘事形態：聯邦＝體制內憑實績攀爬；門派＝恩庇網絡中鑽營）
    - 主角走練氣或煉體
    - 第一批配角與敵對者

