      - "獸災之夜：他在鎮外巡邏塔上發現獸群異狀並誤判（低估規模／攬下「我能處理」），受傷昏迷、醒來發現小鎮已被摧毀，因害怕面對而逃走，事後將逃走重新命名為放逐；聯邦官方登記為天災，無人責怪他，是他自己責怪自己"
