      - "洛克西亞家族：西部荒原旁系家族，八千年前地脈枯竭前曾孕育飛昇境，之後八千年間他人陸續遷離，僅該家族留在此地從事畜牧業、資質持續下滑，今僅存一名垂垂老矣的老金丹；產業為畜牧公司（大地氂牛為主業，靈駒為次），災後外派族人四散接手，血脈未斷絕。[Ch001] 正文已呈現的營運樣貌：牧場柵欄清晨敞開、族人與外來雇工分散於草場邊緣、牧者不吆喝不揮鞭而以氣息驅群、靈駒另有較小的獨立棚舍、牧場外定期停有運貨車出貨"
      - "洛克西亞鎮：位於聯邦西部荒原，語感近似美國大西部，行政歸百公里外的新奧羅市管轄；濕潤多霧、日照不強、喬木稀疏、視野受限，故設有數座巡邏塔；獸潮跟隨當地獸群遷徙習慣，約兩年一次；悲劇後鎮上廢墟經聯邦簡單封鎖，呈無人看守的廢棄狀態"
      - "第一幕發生於天災之前：開場僅有理性我（單一人格），感性我沉睡、折衷我尚未存在；讀者需先與單一人格、天才、果斷勇敢的十五歲少年相處，再看他碎掉——本作核心的多重我設定在第一幕並不存在。[Ch001] 已依此執行：全章無任何多重我或性別流動的跡象，亦無觀察者的暗示"
      - "完整結構推論（供劇情邏輯核對，尚未經作者正式承認）與掛起項目清單見 temp/角色設定_艾茉森洛克西亞_v1.md 第八、九章；掛起項目已同步登記於 bible/plot-threads.yaml"

