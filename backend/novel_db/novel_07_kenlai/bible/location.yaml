# 來源：temp/v43.md（v43）第四、七、九、十章 ＋ chapters/Ch001.md（正文，最高權威）。
# first_appearance 為 Ch001 者已於正文登場；其餘仍為 planned。
# 命名規則：正道區用漢字（可帶現實語感），聯邦區與帝國區用西式語感。未命名之地由作者提供，AI 不代為命名。
# Ch001 已建立的鎮內設施皆以功能稱呼（早餐店、乳製品店、雜貨店、馬廄），刻意未命名——沿用即可。

naming_rules:
  people_and_orgs: 可帶現實語感，視為此世界的原生名稱（偉恩、荒阪、亞特蘭蒂斯）。
  places: 需原創；正道區漢字、聯邦區西式、帝國區西式（與聯邦同調）。漢字地名可帶現實語感（如樓蘭城）。
  pending: AI 不代為命名，新地名由作者逐步提供。

administrative_hierarchy:
  note: 僅適用於正道聯盟（大道洲）。
  levels: 洲 → 州／省 → 郡／府 → 市／城
  rules:
    - 劃分方式與原因沒有固定規則，每個地方都不一樣。
    - 州／省為純粹的地理稱謂，沒有管理者。
    - 實際治權在郡／府與市／城兩級，但不一定；有市長、也有郡主府主，產生方式不作規定。
    - 門派是組織概念而非地理概念，不構成行政區的劃分範圍。

locations:
  # ── 陸塊與海域 ──────────────────────────────
  - id: dadao-continent
    name: 大道洲
    type: 大陸（分北大道洲、南大道洲）
    region: 正道聯盟轄地
    first_appearance: planned
    summary: >
      正道聯盟所在的大陸。三千年前的大戰將整片大陸打成兩半，中間形成絕天海，
      但兩塊陸地仍統稱大道洲，底下分為北大道洲與南大道洲，兩塊皆有人居。
    atmosphere:
      - 門派在山上、城市在山下，兩者物理分離
      - 大多數城市依靈脈而建
    narrative_functions:
      - 正道聯盟制度與門派政治的主舞台
      - 附屬城市層：不由五方直接治理、又不算無主地的空間
    access_constraints:
      - 南北往返須渡絕天海，海象惡劣
    linked_people_or_factions:
      - 正道聯盟、天祠、窺天局、暗影隊、16 個上碑門派
    continuity_notes:
      - 北大道洲靈脈較豐、土地貧瘠；南大道洲除靈脈外資源豐富。
      - 雙向依賴：靈氣南下、物資北上。南方高度依賴北方靈氣；北方對南方物資部分依賴，自給仍可。
      - 上碑門派南北分布：北 7、南 9，但前六名中北方佔五席。北方掌位階，南方掌票。
      - 此地測量學清算最徹底，無科研傳承，卻使用行會留下的標準格式。

  - id: juetian-sea
    name: 絕天海
    type: 海域（古戰場）
    region: 南北大道洲之間
    first_appearance: planned
    summary: >
      三千年前那場大戰打出來的新生海域，因該戰而得名。正道門舊址位於這片海域下方，
      有價值之物早在當年就被正道門殘餘組織打撈殆盡，如今只剩極度混亂的靈氣環境。
    atmosphere:
      - 紊亂靈氣、惡劣海象
      - 適應該環境而生的特種生物
    narrative_functions:
      - 把大道洲切得比地圖上更徹底：聯盟難以團結的物理成因
      - 航運、護航行業與靈氣運輸線的舞台，適合安置低階與無門派角色
    access_constraints:
      - 中央大片區域難以航行
      - 混亂靈氣對練氣與煉體兩者皆有害，皆難以通行
    linked_people_or_factions:
      - 跑這條航線的船隊與護航行業（有門派自營、有獨立經營，並以商會船隊名義加入正道聯盟）
    continuity_notes:
      - 此航線同時是靈氣運輸線，兩岸港口城市因此繁榮。
      - 明確排除：並非走私與黑市主要通道；亦未形成專門的特種生物獵人群體。
      - 兩岸港城尚未命名（待作者提供）。

  - id: omnia-continent
    name: 歐姆尼亞洲（簡稱歐洲）
    type: 大陸
    region: 波希特米亞聯邦所在，與大道洲隔海相望
    first_appearance: planned
    summary: >
      波希特米亞聯邦的大陸。建國前為多個小國並立的戰國時代，約 2800 年前由同盟會
      引發的革命熱潮統一為聯邦。三千年前的清算未及此地，測量學傳承因而延續。
    narrative_functions:
      - 法律、科技與凡修共治的世界；與大道洲形成結構對照
    linked_people_or_factions:
      - 波希特米亞聯邦、偉恩企業、大地綜合行會後裔
    continuity_notes:
      - 東岸為高譚市（偉恩據點），西岸為華盛頓市（首都）。

  - id: atlantis-continent
    name: 亞特蘭蒂斯洲
    type: 大陸（帝國所有領土的集合）
    region: 兩大陸之間的海域
    first_appearance: planned
    summary: >
      亞特蘭蒂斯帝國全部領土的集合。海洋文明，政教合一，半鎖國。
    atmosphere:
      - 陸上城市面海、部分建於水上、另有水下城區
      - 以海為核心的祭典與節慶滲透日常
    access_constraints:
      - 外人入境皆需許可；可經商，不可定居
      - 邊陲管制極鬆、不敵視；中心敵視
      - 例外：接納擅長水法的外人，但生活與文化上仍受本地排斥
    linked_people_or_factions:
      - 皇室、教會、偉恩與荒阪（邊陲滲透）
    continuity_notes:
      - 它擋在正道與聯邦之間的路中間——這是它的真正價值，非強弱。
      - 邊陲＝漫長海岸線與離島，海路最難管，故滲透嚴重。
      - 風貌梯度：越近中心越宏偉保守，越近邊陲越原始但與世界接軌。

  - id: poseidon-peninsula
    name: 波塞頓半島
    type: 半島（帝國皇都所在）
    region: 亞特蘭蒂斯洲
    first_appearance: planned
    summary: >
      亞特蘭蒂斯帝國皇都所在的半島。皇都的核心是神殿與皇宮共構——並非兩座相鄰建築，
      而是一座無法拆分的核心。
    narrative_functions:
      - 帝國權力與信仰的單一中心
    access_constraints:
      - 超級上古秘境的防禦屏障與預警偵測僅於皇都周邊生效
    linked_people_or_factions:
      - 皇室（波賽頓大帝直系血脈）、最高層教會
    continuity_notes:
      - 秘境不供給全國靈氣資源、不具攻擊能力、無法製造軍隊。

  - id: penglai-islands
    name: 蓬萊群島
    type: 群島（無主自由貿易區）
    region: 大道洲東北部外海
    first_appearance: planned
    summary: >
      面積約與日本相當的群島，無主的自由貿易區，魚龍混雜的自由城市。
      荒阪集團的大型總部節點之一即在島上。
    atmosphere:
      - 魚龍混雜、法外之地的自由城市感
    narrative_functions:
      - 黑市、情報、跨勢力交易的中立場域
    linked_people_or_factions:
      - 荒阪集團（已知節點之一）
    continuity_notes:
      - 荒阪的「總部」為複數等價節點，毀去其一不影響其餘。

  - id: formosa-island
    name: 福爾摩沙島
    type: 島嶼（獨立自治，非聯盟成員）
    region: 蓬萊群島南端、大陸東側
    first_appearance: planned
    summary: >
      面積約與台灣相當的小島。在正道門分裂多年之後，效法波希特米亞聯邦創立了自己的
      民權政府，完全獨立，並非正道聯盟成員。
    access_constraints:
      - 島上有秘境「大肚秘境」，使整座島成為天險——除島民外，外人難以出入
    narrative_functions:
      - 「不存在獨立生存的選項」目前唯一的實質例外
    continuity_notes:
      - 它依靠的不是庇護，而是地理上的不可及。

  - id: dadu-secret-realm
    name: 大肚秘境
    type: 秘境
    region: 福爾摩沙島
    first_appearance: planned
    summary: >
      使福爾摩沙島成為天險的秘境，是該島得以完全獨立於正道聯盟之外的實質原因。
    continuity_notes:
      - 詳細機制未定；禁地與秘境的成因本就依地點而異，無統一性質。

  - id: gotham-city
    name: 高譚市
    type: 城市（企業城）
    region: 歐姆尼亞洲東岸，波希特米亞聯邦境內
    first_appearance: planned
    summary: >
      偉恩家族的據點與偉恩企業核心。偉恩完全掌握該市的經濟、行政與司法，
      市政府的司法與行政機關僅為傀儡。
    narrative_functions:
      - 「唯一講法律的地方，法律對唯一該管的對象無效」的具體場景
    linked_people_or_factions:
      - 偉恩家族、偉恩企業、波希特米亞聯邦（名義管轄）
    continuity_notes:
      - 名義上受聯邦法律管轄，但聯邦實務上不敢執法。

  - id: washington-city
    name: 華盛頓市
    type: 城市（首都）
    region: 歐姆尼亞洲西岸
    first_appearance: planned
    summary: >
      波希特米亞聯邦首都，得名自國父恩菲・華盛頓。
    linked_people_or_factions:
      - 大總統柏拉圖・斯坦尼、上下議院、五權機關
    continuity_notes:
      - 聯邦名為聯邦、實為中央集權的統一國家。
      - 內陸另有西部荒原，語感近似美國大西部，為洛克西亞家族世居地（見 western-wasteland）。

  # ── 西部荒原（主角出身地，來源：temp/角色設定_艾茉森洛克西亞_v1.md）──
  - id: western-wasteland
    name: 西部荒原
    type: 地區（荒原）
    region: 歐姆尼亞洲內陸，波希特米亞聯邦境內
    first_appearance: Ch001
    summary: >
      語感近似美國大西部的荒原地區，主角艾茉森・席恩・洛克西亞的出身地。
      地貌類似溫帶苔原，氣候偏冷；短小靈草遍布、喬木稀疏；靈氣濃度正常偏高——
      自古即高於平均，吸引大量動物遷徙，但不足以養大一個宗門家族。
      日照不強，經常為濕潤的多霧氣候。
    atmosphere:
      - 西部拓荒時期的牛仔文化語感，商業街由拓荒風格演變為現代建築
      - 濕潤多霧、視野受限
      - >
        [Ch001] 清晨的標準樣貌（後續晨景可直接沿用）：夜裡的濕氣未散，低矮的天空壓在苔原上，
        薄霧貼地流動、逐層吞沒遠景；空氣微濕帶寒。雲層裂開一道細縫，一絲陽光在霧中照出一條淡金線。
        霧約在早課結束後開始變淡，日出越過地平線時才徹底散盡。
      - >
        [Ch001] 氣味是本地最重要的環境手段：露水浸濕的青草香與揮之不去的牛糞味混在一起，
        「粗糙、濃重，卻讓人安心」——這是洛克西亞鎮每一天早晨的味道。乾草與暖氣的味道屬靈駒棚舍。
    narrative_functions:
      - 主角出身地與童年場景；悲劇（獸災之夜）發生地
      - '[Ch001] 災前日常的基準線：這裡的清晨愈安穩，日後被摧毀時愈重'
    access_constraints:
      - 距最近城鎮數百公里，每天僅一班車進出，其餘靠私人載具或靈駒
      - 靈駒機動性極高，惟飼養成本極高（甚至比一台車貴），不適合城市環境
      - '[Ch001] 註：原規劃要在本章以空蕩公車站或一天一班車的告示帶出行政孤立感，正文未執行，留待後續章節'
    linked_people_or_factions:
      - 洛克西亞家族
    continuity_notes:
      - 獸潮跟隨當地獸群遷徙習慣，約兩年一次，屬可預期的週期性事件。
      - 荒原之所以還能住人，正因為它還會殺人：靈氣偏高吸引動物遷徙，既是資源也是獸患來源。
      - >
        [Ch001] 靈氣濃度的實際體感已由正文定調：對比對象是「真正的宗門靈山」而非一般土地——
        相較宗門靈山，這裡稱得上稀薄，故修煉需更仔細、耗時更長；但相較尋常土地仍偏濃，
        足以讓荒草長得更好、吸引動物循本能前來。這兩句話不矛盾，是同一件事的兩個對比基準，
        後續行文須維持這個雙重基準，不可簡化成單向的「靈氣濃」或「靈氣稀薄」。
      - >
        [Ch001] 家族所在土地能供養靈獸，正文明言是「地脈與周圍環境特殊」，
        而非「擁有取之不盡的天地靈氣」——與八千年前地脈枯竭的設定相容，勿寫成靈氣富饒之地。

  - id: loxia-ranch
    name: 洛克西亞牧場
    type: 產業設施（家族畜牧公司的核心作業區）
    region: 西部荒原，洛克西亞鎮外
    first_appearance: Ch001
    summary: >
      洛克西亞家族畜牧公司的作業現場，位於鎮與家族居住區之間的廣闊苔原草場上。
      大地氂牛為主業，靈駒為次業，兩者的設施分開。
    atmosphere:
      - '[Ch001] 大地氂牛群踏過濕地的蹄聲與咀嚼聲；年輕氂牛偶爾互相擠撞、發出沉悶鼻息'
      - '[Ch001] 遠望時牛群像散落在綠色土地上的一塊塊深色石頭'
    continuity_notes:
      - >
        [Ch001] 晨間作業流程：天亮前柵欄即已打開；數名牧者分散在草場邊緣，不吆喝、不揮鞭，
        只讓熟悉的氣息在晨霧中擴散，牛群便自行穿過敞開的柵門走上苔原低頭吃靈草。
        日出後牧者改為騎馬沿草場邊緣巡行。
      - >
        [Ch001] 靈駒棚舍是另一座較小的獨立建築，安靜得多，有沉重的木門，門內是暖氣與乾草味；
        雇工在此準備飼料。家族馬廄（主角與史黛西所在）另在居住區的另一側，與此棚舍不可混為一談。
      - '[Ch001] 牧場外會停靠運貨車，定期出貨；車輪會在未乾的泥地上輾出兩道深痕'
      - '[Ch001] 人員組成為族人與外來雇工並存，正文中未區分兩者的待遇或位階'

  - id: loxia-family-quarter
    name: 洛克西亞家族居住區
    type: 聚居區
    region: 西部荒原，洛克西亞鎮外、緊鄰牧場
    first_appearance: Ch001
    summary: >
      洛克西亞家族族人居住的區域，主角的家在此。與鎮上的商業街分開，
      由居住區出來穿過一小片草場、再沿緩坡向下，即可抵達鎮上最靠近牧場的那條街。
    continuity_notes:
      - '[Ch001] 家族馬廄位於居住區的另一側，地面鋪木板，最深處的欄位是史黛西的'
      - '[Ch001] 鎮上的鐘聲傳得到這裡，且清晨格外清晰——鐘聲是全鎮共用的作息訊號'
      - '[Ch001] 居住區到早課岩石、居住區到鎮上，都是主角走過無數次的熟路，各只需步行'

  - id: morning-rock
    name: 早課的岩石（山坡）
    type: 地景（主角的固定地點）
    region: 西部荒原，家族居住區外的緩坡中段
    first_appearance: Ch001
    summary: >
      穿過草場邊緣、沿一段不算陡峭的山坡往上，坡的中段有一塊巨大岩石。
      這是主角每天做早課（練氣）的地方，也是正文明言「他最喜歡的地方」。
    atmosphere:
      - '[Ch001] 石面清晨帶著夜裡的濕意；日出後岩石的一側會逐漸變暖'
      - '[Ch001] 晨霧從盤坐者身旁緩緩流過；聲音不會消失（風、咀嚼、遠處人聲、靈駒嘶鳴），只是心靜下來'
    narrative_functions:
      - 主角的日常錨點與制高點；可俯瞰大片草場、牧場與霧中的洛克西亞鎮
      - 一個能同時看見「他的全部世界」的位置——日後回望或對照時的天然機位
    continuity_notes:
      - >
        [Ch001] 正文明確定調此坡的規格：「山坡不高，與那些被真正的修仙宗門佔據的靈山相比，
        它甚至稱不上是山。」此比較是本作衡量西部荒原的標準句式，可延用。
      - '[Ch001] 主角上岩石的方式是單手撐邊緣翻上去，不繞路；盤坐太久下來時雙腿會發麻'

  - id: loxia-town-street
    name: 洛克西亞鎮的那條街
    type: 商業聚落（鎮上唯一一條街）
    region: 洛克西亞鎮
    first_appearance: Ch001
    summary: >
      洛克西亞鎮的商業主街，鎮上生活的全部公共空間。街道不寬，兩旁建築大多不高，
      有石砌的，也有仍保留荒原地區厚實木牆的；房屋之間沒有明確規劃，
      有些店鋪與住家連在一起——一樓開店，樓上住人。
    atmosphere:
      - '[Ch001] 清晨的順序：少數窗戶亮燈 → 店鋪陸續開門、搬出寫著今日商品的木牌、打掃門前積水 → 人漸多'
      - '[Ch001] 街上的氣味會隨接近街心而改變：青草與濕氣逐漸被麵包、煎肉與煮湯的香氣取代'
      - '[Ch001] 街景常備元素：趴在陽光下的狗、推開的窗、收回昨晚晾在外的衣物、站在路邊抽菸的工人'
    continuity_notes:
      - >
        [Ch001] 已登場的店家（皆刻意未命名，沿用功能稱呼即可）：
        乳製品小店（門口木箱裝著剛送來的牛奶，店內有金屬器皿碰撞聲）、
        早餐店（位於街道靠近中央處，門上有鈴鐺，有靠窗的舊椅子，有常客看報紙、喝熱飲）、
        雜貨店（賣海報，正文中僅由主角房間的海報間接提及）。
      - '[Ch001] 鎮上有學校：孩子背書包、會遲到、從巷子裡跑出來'
      - '[Ch001] 鎮上有報紙流通，故與外界並非資訊隔絕'
      - '[Ch001] 主角在早餐店「老樣子」即可點餐，是長期常客；正文中店員問「喝什麼？」後未寫出他的回答，飲品品項尚未寫定，後續可自由決定'

  - id: loxia-town
    name: 洛克西亞鎮
    type: 城鎮（歷史既存聚落，無任何基礎行政設施）
    region: 西部荒原
    first_appearance: Ch001
    summary: >
      洛克西亞家族世居八千年之地，具一條街的商業聚落，居民組成為族人、外來員工與商家，
      社會氛圍為溫和的共同體。因當地多霧、視野受限，鎮外圍設有數座巡邏塔。
      主角艾茉森出身於此，悲劇「獸災之夜」亦發生於此。
    atmosphere:
      - '[Ch001] 溫和的共同體在正文中的具體聲音：熟稔的招呼、無惡意的笑罵、不特殊化任何人'
      - '[Ch001] 鎮不大——主角幾乎知道每一戶人家住在哪裡，也知道哪家店的麵包總是烤得太硬'
    narrative_functions:
      - 主角的悲劇現場；家族失傳功法（天奧玄體來歷所繫）埋藏處
      - '[Ch001] 災前的完整日常已在正文建立，後續毀滅場景可逐項對照'
    access_constraints:
      - 行政上劃歸百公里外的新奧羅市管轄，鎮上本身無任何基礎行政設施
    linked_people_or_factions:
      - 洛克西亞家族、主角（艾茉森・席恩・洛克西亞）、鎮民群像（characters.yaml: loxia-townsfolk）
    continuity_notes:
      - >
        [Ch001] **鎮上的鐘**：清晨以三響鐘聲報時（「——噹——噹——噹」），聲音不宏亮但在清晨格外清晰，
        傳得到牧場與家族居住區。鐘聲代表一天開始，是全鎮共用的作息訊號，每天固定同一時間響
        （正文中店家明說「鐘什麼時候不是那個時間響」）。鐘所在的建築與敲鐘者尚未寫定。
      - '[Ch001] 巡邏塔已在正文以背景剪影出現：街的更外側，塔影孤零零地立在霧中。此時只是環境設施，未被賦予任何意義'
      - '[Ch001] 鎮上有一條街的商業聚落（見 loxia-town-street）、有學校、有報紙；居住區與牧場在鎮外，三者以熟路相連'
      - 獸災之夜後，鎮上廢墟經聯邦簡單封鎖，呈無人看守的廢棄狀態；主角逃走後是否曾回去過未定（見 plot-threads protagonist-11）。
      - 家族失傳的一部功法仍埋在此處廢墟，主角與老金丹皆不知情，詳見 context/secrets-lockbox.md 第五層。
      - 聯邦調查後將該夜事件登記為天災。

  - id: new-aura-city
    name: 新奧羅市（New Aura）
    type: 城市（行政中心）
    region: 西部荒原，距洛克西亞鎮約百公里
    first_appearance: planned
    summary: >
      洛克西亞鎮行政上劃歸的城市。舊奧羅市原在洛克西亞鎮附近，後遷移至州際公路附近成為今日的新奧羅市；
      舊奧羅市遺址仍存在，但只剩廢棄建築，無任何價值。
    continuity_notes:
      - 舊奧羅市遺址與洛克西亞鎮廢墟為兩處不同的廢棄地點，不可混淆。

  - id: longyin-city
    name: 龍隱城
    type: 城市（門派附屬城）
    region: 所在陸地待定
    first_appearance: planned
    summary: >
      現存唯一武神裴思涵的出身地。該城為門派附屬城市，並非直屬於任一門派。
    narrative_functions:
      - 「現存唯一的武神來自沒有門派名字的地方」
    linked_people_or_factions:
      - 裴思涵（舊稱號「神龍大俠」即與此城有意關聯）
    continuity_notes:
      - 所在陸地（南／北大道洲）尚未決定，待作者裁決。

  - id: loulan-city
    name: 樓蘭城（已毀）
    type: 城市（已毀滅的附屬城）
    region: 大道洲
    first_appearance: planned
    summary: >
      一千年以上之前，附屬城市樓蘭城嘗試自行登記加入正道聯盟。登記失敗，
      其原本的上級門派促成報復，整座城市被毀。
    narrative_functions:
      - 「單方面終止合約」的極端案例；有門檻的線索而非失落的歷史
    access_constraints:
      - 記錄現存於門派典籍與聯盟檔案之中，民間無從查證
    continuity_notes:
      - 記錄並未被抹除，而是被刻意忽略與淡忘；聯盟高層為顏面選擇隱匿淡化。
      - 今日城市不敢獨立的恐懼與此事無直接關聯，而是來自聯盟高層的長期壓迫。

  # ── 地點類型（通則，非單一地點）────────────
  - id: forbidden-zones
    name: 禁地（通稱）
    type: 地點類型
    region: 全球
    first_appearance: planned
    summary: >
      依地點而異，成因各不相同，無統一性質。與秘境同為極易產生異象之處（詳見 secrets-lockbox）。
    continuity_notes:
      - 每處禁地成因需個案設定，不可套用統一機制。

  - id: unclaimed-lands
    name: 無主地（通稱）
    type: 地點類型
    region: 全球
    first_appearance: planned
    summary: >
      三種成因並存：貧瘠偏遠沒人要；各方互不相讓維持空白；有小型勢力實控但不屬五方。
    continuity_notes:
      - 不屬五方的小型勢力靠什麼存活，依勢力而異，各有生存之道。
      - 非五方地區總體份量可觀，但分散而無法整合。

  - id: sect-mountains
    name: 山上（門派領地通稱）
    type: 地點類型
    region: 大道洲為主
    first_appearance: planned
    summary: >
      門派領地多為一座山，世稱「山上」。門派所據之山即靈脈所在——佔山即佔靈脈。
      門派極少直接設立於城市之中。
    continuity_notes:
      - 直屬城與門派同名、由門派直接管轄；附屬城自治，名字裡沒有主人。
      - 16 個上碑門派各佔一山、即各佔一條靈脈。
